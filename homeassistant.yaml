    device:
      identifiers: [swisstherm]
  - name: Swisstherm COP
    unique_id: swisstherm_cop
    state_topic: swisstherm/COP
    state_class: measurement
    expire_after: 600
    device:
      identifiers: [swisstherm]
  - name: Swisstherm SCOP
    unique_id: swisstherm_scop
