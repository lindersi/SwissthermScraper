  - name: Swisstherm Puffer Ist
    unique_id: swisstherm_puffer_ist
    state_topic: swisstherm/Puffer Ist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    expire_after: 600
    device:
      identifiers: [swisstherm]
  binary_sensor:
  - name: Swisstherm online
    unique_id: swisstherm_online
    state_topic: swisstherm/Timestamp
    value_template: "{{ true }}"
    expire_after: 600
    device_class: connectivity
    device:
      identifiers: [swisstherm]
