mqtt:
  sensor:
  # --- Energiezähler (on demand: swisstherm/control/zaehler = get) ---
  - name: Swisstherm Gesamtbetriebsstunden
    unique_id: swisstherm_gesamtbetriebsstunden
    state_topic: swisstherm/zaehler/json
    value_template: "{{ value_json['Gesamt-Betriebsstunden Hz/TWE'] | float(default=none) }}"
    unit_of_measurement: h
    state_class: total_increasing
    device:
      identifiers: [swisstherm]
      name: Swisstherm
      manufacturer: PZP / Kermi
      model: x-center
  - name: Swisstherm Gesamtaufnahme Hz
    unique_id: swisstherm_gesamtaufnahme_hz
    state_topic: swisstherm/zaehler/json
    value_template: "{{ value_json['Leistungsaufnahme Hz'] | float(default=none) }}"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Gesamtaufnahme TWE
    unique_id: swisstherm_gesamtaufnahme_twe
    state_topic: swisstherm/zaehler/json
    value_template: "{{ value_json['Leistungsaufnahme TWE'] | float(default=none) }}"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Gesamtbetriebsstunden WEZ 1
    unique_id: swisstherm_betriebsstunden_wez1
    state_topic: swisstherm/zaehler/json
    value_template: "{{ value_json['Betriebsstunden externer WEZ 1'] | float(default=none) }}"
    unit_of_measurement: h
    state_class: total_increasing
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Gesamtbetriebsstunden WEZ 2
    unique_id: swisstherm_betriebsstunden_wez2
    state_topic: swisstherm/zaehler/json
    value_template: "{{ value_json['Betriebsstunden externer WEZ 2'] | float(default=none) }}"
    unit_of_measurement: h
    state_class: total_increasing
    device:
      identifiers: [swisstherm]
  # --- Heizkreis (poll ~30 s) ---
  - name: Swisstherm Status
    unique_id: swisstherm_status
    state_topic: swisstherm/status
    expire_after: 600
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Vorlauf Soll
    unique_id: swisstherm_vorlauf_soll
    state_topic: swisstherm/Vorlauf Soll
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    expire_after: 600
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Vorlauf Ist
    unique_id: swisstherm_vorlauf_ist
    state_topic: swisstherm/Vorlauf Ist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    expire_after: 600
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Wärmeleistung
    unique_id: swisstherm_waermeleistung
    state_topic: swisstherm/Heizleistung
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    expire_after: 600
    device:
      identifiers: [swisstherm]
  - name: Swisstherm Verdichteraufnahme
    unique_id: swisstherm_verdichteraufnahme
    state_topic: swisstherm/Verdichteraufnahme
    unit_of_measurement: kW
    device_class: power
